<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F6">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>설문 현황 | TS 상주교통안전체험교육센터</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ===== 토스풍 디자인 토큰 ===== */
:root{
  --bg:#F2F4F6;
  --surface:#FFFFFF;
  --ink:#191F28;
  --ink-2:#4E5968;
  --ink-3:#8B95A1;
  --line:#E5E8EB;
  --blue:#3182F6;
  --blue-weak:#E8F3FF;
  --blue-press:#1B64DA;
  --red:#F04452;
  --red-weak:#FEE;
  --amber:#FF9500;
  --amber-weak:#FFF4E6;
  --green:#00B26B;
  --r-lg:20px;
  --r-md:16px;
  --r-sm:12px;
}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;min-height:100dvh;
  overflow-x:hidden;
  letter-spacing:-0.3px;
  padding-bottom:env(safe-area-inset-bottom);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:640px;margin:0 auto;padding:0 20px 48px}

/* ===== 코드 게이트 ===== */
#gate{
  min-height:100vh;min-height:100dvh;
  display:flex;align-items:center;justify-content:center;
  padding:24px;
  padding-top:calc(24px + env(safe-area-inset-top));
  padding-bottom:calc(24px + env(safe-area-inset-bottom));
}
.gate-card{width:100%;max-width:280px;text-align:center}
.gate-logo{
  font-size:76px;font-weight:800;letter-spacing:-4px;
  line-height:1;margin-bottom:28px;
}
.gate-logo .t{color:#FF9500}
.gate-logo .s{color:var(--blue)}
.gate-sub{
  font-size:14px;color:var(--ink-3);font-weight:500;
  margin-bottom:16px;letter-spacing:-0.3px;
}
.gate-card input{
  width:100%;padding:18px 20px;
  border:none;border-radius:var(--r-md);
  background:var(--surface);
  font-size:22px;text-align:center;letter-spacing:8px;
  font-weight:700;color:var(--ink);
  min-height:60px;
  font-family:inherit;
  transition:box-shadow .2s;
}
.gate-card input::placeholder{color:#D1D6DB;letter-spacing:8px;font-weight:600}
.gate-card input:focus{outline:none;box-shadow:0 0 0 2px var(--blue)}
.gate-card input.checking{opacity:.55}
.gate-err{color:var(--red);font-size:13px;font-weight:600;margin-top:14px;display:none}

/* ===== 헤더 ===== */
#app{display:none}
.header{
  background:var(--bg);
  padding:calc(20px + env(safe-area-inset-top)) 20px 12px;
  position:sticky;top:0;z-index:20;
}
.header-row{max-width:640px;margin:0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.header-title{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:-0.7px;line-height:1.3}
.header-sub{font-size:13px;color:var(--ink-3);font-weight:500;margin-top:6px;line-height:1.5}
.refresh-btn{
  background:transparent;border:none;
  padding:8px;font-size:0;color:var(--ink-3);
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  min-height:40px;min-width:40px;border-radius:50%;
  transition:background .15s;flex-shrink:0;
}
.refresh-btn:active{background:var(--line)}
.refresh-btn svg{width:20px;height:20px}
.refresh-btn.spin svg{animation:spin .7s cubic-bezier(.4,0,.2,1) infinite}
@keyframes spin{to{transform:rotate(360deg)}}

#headerTotal{
  display:inline-block;border-radius:6px;
  padding:2px 5px;margin:-2px -5px;
  transition:background-color .4s, color .4s;
}
#headerTotal.pulse{animation:pulseGlow 1.8s cubic-bezier(.4,0,.2,1)}
@keyframes pulseGlow{
  0%{background-color:rgba(0,178,107,.14);color:var(--green)}
  55%{background-color:rgba(0,178,107,.14);color:var(--green)}
  100%{background-color:transparent;color:var(--ink-3)}
}
.new-badge{
  display:inline-block;background:var(--green);color:white;
  font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px;
  margin-left:7px;vertical-align:middle;letter-spacing:-0.2px;
  animation:badgeIn .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes badgeIn{
  from{opacity:0;transform:scale(.6) translateY(3px)}
  to{opacity:1;transform:scale(1) translateY(0)}
}

/* ===== 필터 ===== */
.filter-sticky{
  position:sticky;top:calc(72px + env(safe-area-inset-top));z-index:15;
  background:var(--bg);
  padding:8px 0 6px;
}
.filter-bar{
  display:flex;gap:8px;margin-bottom:8px;
  overflow-x:auto;-webkit-overflow-scrolling:touch;
  padding:0 20px 2px;scrollbar-width:none;
  max-width:640px;margin-left:auto;margin-right:auto;
}
.filter-bar::-webkit-scrollbar{display:none}
.filter-bar:last-child{margin-bottom:0}
.chip{
  flex-shrink:0;padding:9px 16px;min-height:38px;
  display:flex;align-items:center;border-radius:20px;
  background:var(--surface);border:none;
  font-size:14px;font-weight:600;color:var(--ink-2);
  cursor:pointer;white-space:nowrap;touch-action:manipulation;
  letter-spacing:-0.3px;
  transition:background .15s, color .15s, transform .1s;
}
.chip:active{transform:scale(0.96)}
.chip.active{background:var(--ink);color:white;font-weight:700}
.chip.alert.active{background:var(--red);color:white}

/* ===== 요약 ===== */
.summary-bar{
  display:flex;gap:0;margin:16px 0 24px;
  background:var(--surface);border-radius:var(--r-lg);
  padding:22px 8px;
}
.summary-box{flex:1;text-align:center;position:relative}
.summary-box + .summary-box::before{
  content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);
  width:1px;height:32px;background:var(--line);
}
.summary-num{font-size:24px;font-weight:700;color:var(--ink);line-height:1.2;letter-spacing:-0.8px}
.summary-label{font-size:13px;color:var(--ink-3);font-weight:500;margin-top:6px;letter-spacing:-0.3px}
.summary-box.alert .summary-num{color:var(--red)}

.source-warning{
  background:var(--amber-weak);color:#A15C00;
  font-size:14px;font-weight:600;padding:14px 16px;
  border-radius:var(--r-md);margin:12px 0 0;line-height:1.5;
}

/* ===== 카드 ===== */
.empty{text-align:center;padding:72px 20px;color:var(--ink-3)}
.empty-icon{font-size:44px;margin-bottom:14px;opacity:.5}
.empty-text{font-size:15px;font-weight:500}

.card{
  background:var(--surface);border-radius:var(--r-lg);
  padding:20px;margin-bottom:12px;
  transition:transform .1s;
  animation:cardIn .32s cubic-bezier(.16,1,.3,1) both;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(8px)}
  to{opacity:1;transform:translateY(0)}
}
@media (prefers-reduced-motion:reduce){
  .card{animation:none}
  .refresh-btn.spin svg{animation:none}
}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;margin-bottom:14px}
.card-course{
  font-size:17px;font-weight:700;color:var(--ink);
  letter-spacing:-0.5px;line-height:1.35;
}
.card-meta{font-size:13px;color:var(--ink-3);font-weight:500;margin-top:5px;line-height:1.5}
.card-score{
  font-size:15px;font-weight:700;line-height:1;flex-shrink:0;
  padding:8px 12px;border-radius:20px;
  letter-spacing:-0.3px;white-space:nowrap;
}
.score-low .card-score{background:var(--red-weak);color:var(--red)}
.score-mid .card-score{background:var(--amber-weak);color:#D97706}
.score-high .card-score{background:var(--blue-weak);color:var(--blue)}
.card-score .unit{font-size:12px;font-weight:600;opacity:.65}

.src-badge{
  display:inline-block;font-size:12px;font-weight:600;
  padding:3px 9px;border-radius:8px;margin-left:7px;
  vertical-align:middle;letter-spacing:-0.2px;
}
.src-badge.taxi_out{background:var(--blue-weak);color:var(--blue)}
.src-badge.gaein{background:var(--amber-weak);color:#C2410C}

.tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tag{font-size:12px;font-weight:600;padding:5px 11px;border-radius:8px;letter-spacing:-0.2px}
.tag.complaint{background:var(--red-weak);color:var(--red)}
.tag.good{background:var(--blue-weak);color:var(--blue)}

.text-block{
  font-size:14px;line-height:1.65;padding:14px 16px;
  border-radius:var(--r-sm);margin-top:8px;
  background:#F7F8FA;color:var(--ink-2);border:none;
  letter-spacing:-0.3px;
}
.text-block.complaint{background:#FFF7F7;color:#8B2E36}
.text-block.good{background:#F4F9FF;color:#1E4A82}
.text-block b{
  display:block;font-size:12px;margin-bottom:5px;
  font-weight:700;opacity:.65;letter-spacing:-0.2px;
}

.footer-note{
  text-align:center;font-size:13px;color:var(--ink-3);
  font-weight:500;margin-top:28px;letter-spacing:-0.3px;
}
</style>
</head>
<body>

<!-- 코드 게이트 -->
<div id="gate">
  <div class="gate-card">
    <div class="gate-logo"><span class="t">T</span><span class="s">S</span></div>
    <div class="gate-sub">접속코드를 입력해 주세요</div>
    <input type="tel" id="codeInput" placeholder="0000" maxlength="8" inputmode="numeric">
    <div class="gate-err" id="gateErr">코드가 올바르지 않아요</div>
  </div>
</div>

<!-- 본문 -->
<div id="app">
  <div class="header">
    <div class="header-row">
      <div>
        <div class="header-title">설문 현황</div>
        <div class="header-sub"><span id="headerTotal">-</span> · <span id="lastUpdated">불러오는 중</span></div>
      </div>
      <button class="refresh-btn" id="refreshBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/></svg>
        새로고침
      </button>
    </div>
  </div>

  <div class="wrap">
    <div class="source-warning" id="sourceWarning" style="display:none"></div>
  </div>

  <div class="filter-sticky">
    <div class="filter-bar" id="sourceBar"></div>
    <div class="filter-bar" id="filterBar"></div>
    <div class="filter-bar" id="monthBar"></div>
  </div>

  <div class="wrap">
    <div class="summary-bar">
      <div class="summary-box">
        <div class="summary-num" id="sumTotal">-</div>
        <div class="summary-label">필터된 응답</div>
      </div>
      <div class="summary-box alert">
        <div class="summary-num" id="sumComplaint">-</div>
        <div class="summary-label">불편사항</div>
      </div>
      <div class="summary-box">
        <div class="summary-num" id="sumAvg">-</div>
        <div class="summary-label">평균 만족도</div>
      </div>
    </div>

    <div id="cardList"></div>
    <div class="footer-note">최근 응답부터 보여드려요 · 30초마다 자동으로 새로고침돼요</div>
  </div>
</div>

<script>
// 두 설문의 Apps Script 웹앱 URL
var SOURCES = [
  {
    key: 'taxi_out',
    label: '택시 외',
    url: 'https://script.google.com/macros/s/AKfycbwnQYYRocQD0hYFuXSqAjNX57Vobsh1XreqzAebMhBAsYYaoRWCJhXVO1VuDZ8ncCU/exec'
  },
  {
    key: 'gaein',
    label: '개인택시양수',
    url: 'https://script.google.com/macros/s/AKfycbwkhAQkLibwWOq30YiTxXTdPa1j6BK6jDK0yWVYqzmUQ_o0zKRO1mFEMd-3xMuBPVb1/exec'
  }
];

var STORAGE_KEY = 'ts_view_code_combined';
var allData = [];
var currentCourseFilter = '전체';
var currentSourceFilter = '전체';
var currentMonthFilter = '전체';
var complaintOnly = false;
var autoRefreshTimer = null;
var prevOverallTotal = null;
var newResponseCount = 0;

// ---- 코드 게이트 ----
var savedCode = localStorage.getItem(STORAGE_KEY);
if (savedCode) {
  tryLoad(savedCode);
}

var codeInputEl = document.getElementById('codeInput');
var autoSubmitTimer = null;

codeInputEl.addEventListener('input', function(){
  document.getElementById('gateErr').style.display = 'none';
  var code = codeInputEl.value.trim();
  clearTimeout(autoSubmitTimer);
  // 4자리 이상 입력되면 잠깐 기다렸다가 자동으로 확인
  if (code.length >= 4) {
    autoSubmitTimer = setTimeout(function(){ tryLoad(code); }, 400);
  }
});
codeInputEl.addEventListener('keydown', function(e){
  if (e.key === 'Enter') {
    clearTimeout(autoSubmitTimer);
    var code = codeInputEl.value.trim();
    if (code) tryLoad(code);
  }
});

function fetchAllSources(code) {
  var promises = SOURCES.map(function(src){
    return fetch(src.url + '?mode=view&code=' + encodeURIComponent(code))
      .then(function(r){ return r.json(); })
      .then(function(data){
        if (data && data.error) return { key: src.key, ok: false, rows: [] };
        var rows = data.map(function(row){ row.__source = src.key; row.__sourceLabel = src.label; return row; });
        return { key: src.key, ok: true, rows: rows };
      })
      .catch(function(){ return { key: src.key, ok: false, rows: [] }; });
  });
  return Promise.all(promises);
}

function tryLoad(code) {
  document.getElementById('gateErr').style.display = 'none';
  var inputEl = document.getElementById('codeInput');
  if (inputEl) inputEl.classList.add('checking');
  fetchAllSources(code).then(function(results){
    if (inputEl) inputEl.classList.remove('checking');
    var anyOk = results.some(function(r){ return r.ok; });
    if (!anyOk) {
      document.getElementById('gateErr').textContent = '코드가 올바르지 않아요';
      document.getElementById('gateErr').style.display = 'block';
      localStorage.removeItem(STORAGE_KEY);
      return;
    }
    localStorage.setItem(STORAGE_KEY, code);
    document.getElementById('gate').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    allData = results.reduce(function(acc, r){ return acc.concat(r.rows); }, []);
    prevOverallTotal = allData.length; // 최초 로드 기준값 (반짝임 없음)
    showSourceWarning(results);
    render();
    startAutoRefresh(code);
  });
}

function showSourceWarning(results) {
  var failed = results.filter(function(r){ return !r.ok; });
  var el = document.getElementById('sourceWarning');
  if (failed.length) {
    var names = failed.map(function(r){
      var src = SOURCES.filter(function(s){ return s.key === r.key; })[0];
      return src ? src.label : r.key;
    }).join(', ');
    el.textContent = names + ' 설문을 불러오지 못했어요. 접속코드나 주소를 확인해 주세요';
    el.style.display = 'block';
  } else {
    el.style.display = 'none';
  }
}

function startAutoRefresh(code) {
  if (autoRefreshTimer) clearInterval(autoRefreshTimer);
  autoRefreshTimer = setInterval(function(){ refresh(code); }, 30000);
}

function refresh(code) {
  var btn = document.getElementById('refreshBtn');
  btn.classList.add('spin');
  fetchAllSources(code).then(function(results){
    var anyOk = results.some(function(r){ return r.ok; });
    if (anyOk) {
      var newData = results.reduce(function(acc, r){ return acc.concat(r.rows); }, []);
      var newTotal = newData.length;
      if (prevOverallTotal !== null && newTotal > prevOverallTotal) {
        newResponseCount = newTotal - prevOverallTotal;
      }
      prevOverallTotal = newTotal;
      allData = newData;
      showSourceWarning(results);
      render();
    }
    btn.classList.remove('spin');
  });
}

document.getElementById('refreshBtn').addEventListener('click', function(){
  var code = localStorage.getItem(STORAGE_KEY);
  if (code) refresh(code);
});

// ---- 렌더링 ----
function monthKey(eduDate) {
  if (!eduDate) return null;
  var m = String(eduDate).match(/^(\d{4})-(\d{2})/);
  return m ? (m[1] + '-' + m[2]) : null;
}

function monthLabel(mk) {
  var parts = mk.split('-');
  return parts[0].slice(2) + "년 " + parseInt(parts[1], 10) + "월";
}

function avgScore(row) {
  var keys = ['r1','r2','r3','r4','r5','r6','r7','r8','r9','r10'];
  var sum = 0, cnt = 0;
  keys.forEach(function(k){
    var v = row[k];
    if (v !== '' && v !== null && v !== undefined && !isNaN(v)) { sum += Number(v); cnt++; }
  });
  return cnt ? sum / cnt : null;
}

function hasComplaint(row) {
  return row.impEduYn == 2 || row.impFacilityYn == 2 || row.impEtcYn == 2;
}

function scoreClass(avg) {
  if (avg === null) return '';
  if (avg < 5) return 'score-low';
  if (avg < 8) return 'score-mid';
  return 'score-high';
}

function syncStickyOffset() {
  var header = document.querySelector('.header');
  var filterSticky = document.querySelector('.filter-sticky');
  if (header && filterSticky) {
    filterSticky.style.top = header.offsetHeight + 'px';
  }
}
window.addEventListener('resize', syncStickyOffset);
window.addEventListener('orientationchange', function(){ setTimeout(syncStickyOffset, 200); });

function render() {
  syncStickyOffset();
  // 설문 구분 필터칩
  var sourceBar = document.getElementById('sourceBar');
  sourceBar.innerHTML = '';
  var sourceOptions = [{ key: '전체', label: '전체 설문' }].concat(
    SOURCES.map(function(s){ return { key: s.key, label: s.label }; })
  );
  sourceOptions.forEach(function(opt){
    var chip = document.createElement('div');
    chip.className = 'chip' + (opt.key === currentSourceFilter ? ' active' : '');
    chip.textContent = opt.label;
    chip.onclick = function(){ currentSourceFilter = opt.key; currentCourseFilter = '전체'; currentMonthFilter = '전체'; render(); };
    sourceBar.appendChild(chip);
  });

  // 과정 목록 필터칩 구성 (선택된 설문 구분 내에서만)
  var scoped = allData.filter(function(row){
    return currentSourceFilter === '전체' || row.__source === currentSourceFilter;
  });

  // 헤더의 "전체 누적" 표시 - 과정/월 필터와 무관하게 현재 선택된 설문 구분 기준 총원
  var sourceLabelForTotal = currentSourceFilter === '전체'
    ? '전체'
    : (SOURCES.filter(function(s){ return s.key === currentSourceFilter; })[0] || {}).label;
  var headerTotalEl = document.getElementById('headerTotal');
  headerTotalEl.textContent = sourceLabelForTotal + ' ' + scoped.length + '명 응답';

  if (newResponseCount > 0) {
    var badge = document.createElement('span');
    badge.className = 'new-badge';
    badge.textContent = '+' + newResponseCount;
    headerTotalEl.appendChild(badge);
    headerTotalEl.classList.remove('pulse');
    void headerTotalEl.offsetWidth; // 애니메이션 재시작을 위한 리플로우
    headerTotalEl.classList.add('pulse');
    newResponseCount = 0; // 한 번 표시했으면 초기화
    setTimeout(function(){
      headerTotalEl.classList.remove('pulse');
      if (badge.parentNode) badge.parentNode.removeChild(badge);
    }, 4000);
  }

  var courses = ['전체'];
  scoped.forEach(function(row){
    if (row.courseName && courses.indexOf(row.courseName) === -1) courses.push(row.courseName);
  });

  var filterBar = document.getElementById('filterBar');
  filterBar.innerHTML = '';
  courses.forEach(function(c){
    var chip = document.createElement('div');
    chip.className = 'chip' + (c === currentCourseFilter ? ' active' : '');
    chip.textContent = c;
    chip.onclick = function(){ currentCourseFilter = c; currentMonthFilter = '전체'; render(); };
    filterBar.appendChild(chip);
  });
  var alertChip = document.createElement('div');
  alertChip.className = 'chip alert' + (complaintOnly ? ' active' : '');
  alertChip.textContent = '불편사항만';
  alertChip.onclick = function(){ complaintOnly = !complaintOnly; render(); };
  filterBar.appendChild(alertChip);

  // 월별 필터칩 구성 (선택된 설문+과정 내에서만, 입교일자 기준 YYYY-MM)
  var scopedForMonth = scoped.filter(function(row){
    return currentCourseFilter === '전체' || row.courseName === currentCourseFilter;
  });
  var monthKeys = [];
  scopedForMonth.forEach(function(row){
    var mk = monthKey(row.eduDate);
    if (mk && monthKeys.indexOf(mk) === -1) monthKeys.push(mk);
  });
  monthKeys.sort().reverse(); // 최신 월이 앞으로

  var monthBar = document.getElementById('monthBar');
  monthBar.innerHTML = '';
  if (monthKeys.length > 0) {
    var allChip = document.createElement('div');
    allChip.className = 'chip' + (currentMonthFilter === '전체' ? ' active' : '');
    allChip.textContent = '전체 기간';
    allChip.onclick = function(){ currentMonthFilter = '전체'; render(); };
    monthBar.appendChild(allChip);

    monthKeys.forEach(function(mk){
      var chip = document.createElement('div');
      chip.className = 'chip' + (mk === currentMonthFilter ? ' active' : '');
      chip.textContent = monthLabel(mk);
      chip.onclick = function(){ currentMonthFilter = mk; render(); };
      monthBar.appendChild(chip);
    });
  }

  // 필터 적용
  var filtered = allData.filter(function(row){
    if (currentSourceFilter !== '전체' && row.__source !== currentSourceFilter) return false;
    if (currentCourseFilter !== '전체' && row.courseName !== currentCourseFilter) return false;
    if (currentMonthFilter !== '전체' && monthKey(row.eduDate) !== currentMonthFilter) return false;
    if (complaintOnly && !hasComplaint(row)) return false;
    return true;
  });

  // 요약
  document.getElementById('sumTotal').textContent = filtered.length + '명';
  document.getElementById('sumComplaint').textContent = filtered.filter(hasComplaint).length;
  var avgs = filtered.map(avgScore).filter(function(v){ return v !== null; });
  var overallAvg = avgs.length ? (avgs.reduce(function(a,b){return a+b;},0) / avgs.length) : null;
  document.getElementById('sumAvg').textContent = overallAvg !== null ? overallAvg.toFixed(1) : '-';

  // 카드 목록
  var listEl = document.getElementById('cardList');
  listEl.innerHTML = '';

  if (filtered.length === 0) {
    listEl.innerHTML = '<div class="empty"><div class="empty-icon">🗒️</div><div class="empty-text">아직 해당하는 응답이 없어요</div></div>';
  } else {
    filtered.forEach(function(row, idx){
      var avg = avgScore(row);
      var cls = scoreClass(avg);
      var card = document.createElement('div');
      card.className = 'card ' + cls;
      card.style.animationDelay = Math.min(idx * 22, 260) + 'ms';

      var html = '';
      html += '<div class="card-top">';
      html += '  <div><div class="card-course">' + escapeHtml(row.courseName || '(과정명 미상)') +
              '<span class="src-badge ' + row.__source + '">' + escapeHtml(row.__sourceLabel) + '</span></div>';
      html += '  <div class="card-meta">' + escapeHtml(row.eduDate || '-') + ' 입교 · No.' + escapeHtml(row.num) +
              (row.transfer ? ' · 양수계획 ' + escapeHtml(row.transfer) : '') + '</div></div>';
      html += '  <div class="card-score">' + (avg !== null ? avg.toFixed(1) : '-') + '<span class="unit">점</span></div>';
      html += '</div>';

      var tags = '';
      if (row.impEduYn == 2) tags += '<span class="tag complaint">교육 불편</span>';
      if (row.impFacilityYn == 2) tags += '<span class="tag complaint">시설 불편</span>';
      if (row.impEtcYn == 2) tags += '<span class="tag complaint">기타의견</span>';
      if (row.satisfiedText) tags += '<span class="tag good">만족 포인트</span>';
      if (tags) html += '<div class="tag-row">' + tags + '</div>';

      if (row.impEduYn == 2 && row.impEduText) {
        html += '<div class="text-block complaint"><b>교육 불편사항</b>' + escapeHtml(row.impEduText) + '</div>';
      }
      if (row.impFacilityYn == 2 && row.impFacilityText) {
        html += '<div class="text-block complaint"><b>시설 불편사항</b>' + escapeHtml(row.impFacilityText) + '</div>';
      }
      if (row.impEtcYn == 2 && row.impEtcText) {
        html += '<div class="text-block complaint"><b>기타 의견</b>' + escapeHtml(row.impEtcText) + '</div>';
      }
      if (row.satisfiedText) {
        html += '<div class="text-block good"><b>만족스러운 내용</b>' + escapeHtml(row.satisfiedText) + '</div>';
      }

      card.innerHTML = html;
      listEl.appendChild(card);
    });
  }

  var now = new Date();
  document.getElementById('lastUpdated').textContent =
    now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0') + ' 기준';
}

function escapeHtml(str) {
  if (str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}
</script>
</body>
</html>
